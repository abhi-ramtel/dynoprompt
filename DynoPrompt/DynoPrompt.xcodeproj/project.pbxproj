			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -euo pipefail\nSRC=\"$SRCROOT/ThirdParty/models/ggml-base.en.bin\"\n# The helper is sandboxed and may read its own bundle, but NOT the containing\n# app's Resources, so the model ships inside WhisperService.xpc.\nDEST_DIR=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/XPCServices/WhisperService.xpc/Contents/Resources/models\"\n# Record whether whisper.cpp was really vendored or only stubbed, so the app\n# can tell the user the truth instead of blaming their model file.\nSERVICE_DIR=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/XPCServices/WhisperService.xpc\"\nSERVICE_RES=\"$SERVICE_DIR/Contents/Resources\"\nif [ -d \"$SERVICE_DIR\" ]; then\n  # The Resources folder may not exist yet when there is no model to\n  # copy, so create it rather than skipping the marker.\n  mkdir -p \"$SERVICE_RES\"\n  rm -f \"$SERVICE_RES/.whisper-stub\"\n  if [ -f \"$SRCROOT/ThirdParty/whisper/.stub\" ]; then\n    : > \"$SERVICE_RES/.whisper-stub\"\n  fi\nfi\nif [ ! -f \"$SRC\" ]; then\n  echo \"warning: ggml-base.en.bin not found; run Scripts/fetch-model.sh. Falling back to an external whisper.cpp install at runtime.\"\n  exit 0\nfi\nif [ ! -d \"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/XPCServices/WhisperService.xpc\" ]; then\n  echo \"warning: WhisperService.xpc not embedded; skipping model copy.\"\n  exit 0\nfi\nmkdir -p \"$DEST_DIR\"\n# Copy only when changed: the model is ~141 MB and this phase runs every build.\nif [ ! -f \"$DEST_DIR/ggml-base.en.bin\" ] || [ \"$SRC\" -nt \"$DEST_DIR/ggml-base.en.bin\" ]; then\n  cp \"$SRC\" \"$DEST_DIR/ggml-base.en.bin\"\nfi\n";
